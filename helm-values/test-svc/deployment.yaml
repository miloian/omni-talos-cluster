# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test5-deployment
  labels:
    app: test5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test5
  template:
    metadata:
      labels:
        app: test5
    spec:
      containers:
      - name: test5-container
        image: nginx:alpine
        ports:
        - containerPort: 80

